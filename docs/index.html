        }

            color: #64748b;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            background: #cbd5e1;
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

            display: grid;
            grid-template-columns: repeat(2, 1fr);

        }

        @media (max-width: 1200px) {
            .indices-grid {

            }
        }

            color: white;
            border: none;
            border-radius: 6px;

            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;

        }

            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

            font-size: 1.4em;
            font-weight: bold;
            color: #1e293b;
        }

            text-align: right;
        }

            font-size: 1.8em;
            font-weight: bold;
            color: #1e293b;
        }

            font-size: 1em;
            margin-top: 5px;
        }

        .index-value .change.positive {
            color: #10b981;
        }

        .index-value .change.negative {
            color: #ef4444;
        }

        .chart-container {
            height: 400px;
            position: relative;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;

            width: 90%;

        // 根据时间范围获取数据粒度（interval）
        function getDataInterval(range) {
            // 智能粒度选择：根据时间范围选择最合适的数据粒度
            switch(range) {
                case '1H':      // 1小时 → 1分钟粒度
                    return '1m';
                case '1D':      // 1天 → 5分钟粒度
                    return '5m';
                case '1W':      // 1周 → 15分钟粒度
                    return '15m';
                case '1M':      // 1月 → 1小时粒度
                    return '1h';
                case '3M':      // 3月 → 1小时粒度
                    return '1h';
                case 'all':     // 全部 → 1天粒度
                default:
                    return '1d';
            }
        }

        // 根据时间范围获取数据起始日期
        function getDataStartDate(range) {
            const now = new Date();
            switch(range) {
                case '1H':
                    // 1小时：1分钟粒度，最近1小时
                    return new Date(now.getTime() - 60 * 60 * 1000);
                case '1D':
                    // 1天：5分钟粒度，最近7天（Yahoo API限制）
                    return new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                case '1W':
                    // 1周：15分钟粒度，最近7天
                    return new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                case '1M':
                    // 1月：1小时粒度，最近30天
                    return new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                case '3M':
                    // 3月：1小时粒度，最近90天
                    return new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000);
                case 'all':
                default:
                    // 全部：1天粒度，从2025-01-01开始
                    return new Date('2025-01-01');
            }
        }

        // 判断时间点是否在交易时间内
        function isWithinTradingHours(date, category) {
            const hour = date.getHours();
            const minute = date.getMinutes();
            const timeInMinutes = hour * 60 + minute;
            
            if (category === 'hk') {
                // 港股交易时间：09:30-12:00, 13:00-16:00
                return (timeInMinutes >= 9 * 60 + 30 && timeInMinutes <= 12 * 60) ||
                       (timeInMinutes >= 13 * 60 && timeInMinutes <= 16 * 60);
            } else if (category === 'cn') {
                // A股交易时间：09:30-11:30, 13:00-15:00
                return (timeInMinutes >= 9 * 60 + 30 && timeInMinutes <= 11 * 60 + 30) ||
                       (timeInMinutes >= 13 * 60 && timeInMinutes <= 15 * 60);
            } else if (category === 'us') {
                // 美股交易时间（北京时间）：
                // 夏令时 21:30 - 次日04:00
                // 冬令时 22:30 - 次日05:00
                // 简化处理：接受所有数据点（因为时区复杂）
                return true;
            }
            
            return true; // 默认接受所有时间
        }

        // 调整日期时间到正确的收盘时间（北京时间）
        function adjustToMarketCloseTime(date, category) {
            const d = new Date(date);
            const year = d.getFullYear();
            const month = d.getMonth();
            const day = d.getDate();

            // 根据市场类型设置收盘时间
            if (category === 'us') {
                // 美股：北京时间次日05:00收盘（冬令时）
                // 需要判断是否是夏令时（3月第二个周日 - 11月第一个周日）
                const isDST = isDaylightSavingTime(d);

                if (isDST) {
                    // 夏令时：北京时间次日04:00
                    return new Date(year, month, day + 1, 4, 0, 0);
                } else {
                    // 冬令时：北京时间次日05:00
                    return new Date(year, month, day + 1, 5, 0, 0);
                }
            } else if (category === 'hk') {
                // 港股：北京时间16:00收盘
                return new Date(year, month, day, 16, 0, 0);
            } else if (category === 'cn') {
                // A股：北京时间15:00收盘
                return new Date(year, month, day, 15, 0, 0);
            }

            // 默认返回原始时间
            return d;
        }

        // 判断是否是美国夏令时（3月第二个周日 - 11月第一个周日）
        function isDaylightSavingTime(date) {
            const year = date.getFullYear();

            // 3月第二个周日
            const marchSecondSunday = getNthSundayOfMonth(year, 2, 1);

            // 11月第一个周日
            const novemberFirstSunday = getNthSundayOfMonth(year, 10, 0);

            return date >= marchSecondSunday && date < novemberFirstSunday;
        }

        // 获取某月第N个周日
        function getNthSundayOfMonth(year, month, n) {
            const firstDay = new Date(year, month, 1);
            const firstSunday = firstDay.getDay() === 0 ? 1 : (7 - firstDay.getDay() + 1);
            return new Date(year, month, firstSunday + (n * 7), 2, 0, 0); // 凌晨2点切换
        }

        // 初始化单个图表
        function initChart(index) {
            const ctx = document.getElementById(`${index.id}-chart`).getContext('2d');
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: index.name,
                        data: [],
                        borderColor: index.color,
                        backgroundColor: `${index.color}20`,
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        tension: 0.1,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                filter: function(legendItem, chartData) {
                                    if (legendItem.text.includes('背景')) return false;
                                    const datasets = chartData.datasets;
                                    const firstIndex = datasets.findIndex(ds => ds.label === legendItem.text);
                                    return legendItem.datasetIndex === firstIndex;
                                },
                                padding: 15,
                                boxWidth: 40,
                                boxHeight: 15,
                                font: { size: 13 }
                            },
                            onClick: function(e, legendItem, legend) {
                                const chart = legend.chart;
                                const labelText = legendItem.text;
                                const datasetsToToggle = chart.data.datasets
                                    .map((ds, idx) => ({ ds, idx }))
                                    .filter(item => item.ds.label === labelText);
                                if (datasetsToToggle.length === 0) return;
                                const isCurrentlyHidden = chart.isDatasetVisible(datasetsToToggle[0].idx) === false;
                                datasetsToToggle.forEach(item => {
                                    chart.setDatasetVisibility(item.idx, isCurrentlyHidden);
                                });
                                chart.update();
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                title: function(context) {
                                    if (!context || context.length === 0) return '';
                                    
                                    const chart = context[0].chart;
                                    const xScale = chart.scales.x;
                                    const tooltip = chart.tooltip;
                                    
                                    let mouseTimeValue;
                                    
                                    // 使用tooltip的caretX获取鼠标在x轴上的实际位置
                                    if (tooltip && tooltip.caretX !== undefined) {
                                        mouseTimeValue = xScale.getValueForPixel(tooltip.caretX);
                                    } else {
                                        // 降级：使用主数据线的时间
                                        const mainDataItem = context.find(item => item.dataset.label === index.name);
                                        mouseTimeValue = mainDataItem ? mainDataItem.parsed.x : context[0].parsed.x;
                                    }
                                    
                                    const date = new Date(mouseTimeValue);
                                    const year = date.getFullYear();
                                    const month = String(date.getMonth() + 1).padStart(2, '0');
                                    const day = String(date.getDate()).padStart(2, '0');
                                    const hour = String(date.getHours()).padStart(2, '0');
                                    const minute = String(date.getMinutes()).padStart(2, '0');
                                    const second = String(date.getSeconds()).padStart(2, '0');
                                    return `${year}-${month}-${day} ${hour}:${minute}:${second} (北京时间)`;
                                },
                                beforeLabel: (context) => {
                                    return '';
                                },
                                label: function(context) {
                                    const dataset = context.dataset;
                                    const value = context.parsed.y;
                                    if (!value) return null;
                                    
                                    // 背景渐变不显示
                                    if (dataset.fill && !dataset.isPivot) return null;
                                    
                                    // 如果是枢轴点，需要检查鼠标是否在其有效期内
                                    if (dataset.isPivot && dataset.data.length === 2) {
                                        const startX = dataset.data[0].x.getTime();
                                        const endX = dataset.data[1].x.getTime();
                                        
                                        // 获取鼠标实际位置（与title使用相同的方法）
                                        const chart = context.chart;
                                        const xScale = chart.scales.x;
                                        const tooltip = chart.tooltip;
                                        
                                        let mouseTime;
                                        if (tooltip && tooltip.caretX !== undefined) {
                                            mouseTime = xScale.getValueForPixel(tooltip.caretX);
                                        } else {
                                            // 降级：使用主数据线的时间
                                            const mainItem = tooltip.dataPoints.find(
                                                item => item.dataset.label === index.name
                                            );
                                            mouseTime = mainItem ? mainItem.parsed.x : context.parsed.x;
                                        }
                                        
                                        // 鼠标不在有效期内，不显示此枢轴点
                                        if (mouseTime < startX || mouseTime > endX) {
                                            return null;
                                        }
                                        
                                        // 显示完整标签
                                        if (dataset.pivotLabel) {
                                            return `${dataset.pivotLabel}: ${value.toFixed(2)}`;
                                        }
                                    }
                                    
                                    // 普通指数数据
                                    if (dataset.label === index.name) {
                                        return `指数值: ${value.toFixed(2)}`;
                                    }
                                    
                                    return null;
                                },
                                beforeBody: function(tooltipItems) {
                                    tooltipItems.sort((a, b) => b.parsed.y - a.parsed.y);
                                    return [];
                                }
                            }
                        },
                        zoom: {
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'x'
                            },
                            pan: {
                                enabled: true,
                                mode: 'x'
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    hour: 'MM-dd HH:mm',
                                    day: 'MM-dd',
                                    week: 'MM-dd',
                                    month: 'yyyy-MM'
                                },
                                tooltipFormat: 'yyyy-MM-dd HH:mm:ss'
                            },
                            ticks: {
                                callback: function(value, index, ticks) {
                                    // 显示北京时间
                                    const date = new Date(value);
                                    const month = String(date.getMonth() + 1).padStart(2, '0');
                                    const day = String(date.getDate()).padStart(2, '0');
                                    const hour = String(date.getHours()).padStart(2, '0');
                                    const minute = String(date.getMinutes()).padStart(2, '0');

                                    // 根据当前时间单位显示不同格式
                                    const timeUnit = this.options.time.unit;
                                    if (timeUnit === 'hour') {
                                        return `${month}-${day} ${hour}:${minute}`;
                                    } else if (timeUnit === 'day') {
                                        return `${month}-${day}`;
                                    } else if (timeUnit === 'week' || timeUnit === 'month') {
                                        return `${month}-${day}`;
                                    }
                                    return value;
                                }
                            }
                        },

        // 本地数据缓存管理（支持按interval分别缓存）
        function saveCachedData(indexId, data, interval = '1d') {
            try {
                // 将Date对象转换为时间戳以便存储
                const serializedData = data.map(d => ({
                    x: d.x.getTime(),
                    y: d.y
                }));
                const cacheKey = `cache_${indexId}_${interval}`;
                localStorage.setItem(cacheKey, JSON.stringify(serializedData));
                localStorage.setItem(`${cacheKey}_timestamp`, Date.now().toString());
                console.log(`💾 [${indexId}] 数据已缓存 (${interval})`);
            } catch (e) {
                console.warn(`⚠️ [${indexId}] 缓存保存失败:`, e);
            }
        }

        function loadCachedData(indexId, interval = '1d') {
            try {
                const cacheKey = `cache_${indexId}_${interval}`;
                const cached = localStorage.getItem(cacheKey);
                if (!cached) return null;

                const serializedData = JSON.parse(cached);
                // 将时间戳转换回Date对象
                return serializedData.map(d => ({
                    x: new Date(d.x),
                    y: d.y
                }));
            } catch (e) {
                console.warn(`⚠️ [${indexId}] 缓存加载失败:`, e);
                return null;
            }
        }

        function getCacheAge(indexId, interval = '1d') {
            const cacheKey = `cache_${indexId}_${interval}`;
            const timestamp = localStorage.getItem(`${cacheKey}_timestamp`);
            if (!timestamp) return Infinity;
            return Date.now() - parseInt(timestamp);
        }

        // 根据数据粒度和市场状态，获取缓存最大有效期（智能过期策略）
        function getCacheMaxAge(interval) {
            // 检查是否有市场开盘
            const anyMarketOpen = indices.some(idx => isMarketOpen(idx.category));
            
            if (anyMarketOpen) {
                // 开盘时：根据粒度设置短期缓存
                switch(interval) {
                    case '1m':  return 1 * 60 * 1000;       // 1分钟
                    case '5m':  return 5 * 60 * 1000;       // 5分钟
                    case '15m': return 15 * 60 * 1000;      // 15分钟
                    case '1h':  return 5 * 60 * 1000;       // 5分钟（开盘时更频繁）
                    case '1d':  return 60 * 60 * 1000;      // 1小时
                    default:    return 5 * 60 * 1000;       // 默认5分钟
                }
            } else {
                // 盘后：使用较长缓存时间
                switch(interval) {
                    case '1m':  return 30 * 60 * 1000;      // 30分钟
                    case '5m':  return 30 * 60 * 1000;      // 30分钟
                    case '15m': return 60 * 60 * 1000;      // 1小时
                    case '1h':  return 60 * 60 * 1000;      // 1小时
                    case '1d':  return 24 * 60 * 60 * 1000; // 24小时
                    default:    return 60 * 60 * 1000;      // 默认1小时
                }
            }
        }

        // 检查缓存是否有效
        function isCacheValid(indexId, interval) {
            const age = getCacheAge(indexId, interval);
            const maxAge = getCacheMaxAge(interval);
            return age < maxAge;
        }

                console.log(`🔄 [${index.name}] 开始获取数据 (粒度: ${interval})...`);

                // 先加载缓存数据
                const cachedData = loadCachedData(index.id, interval);
                
                // 检查缓存是否有效
                const cacheValid = cachedData && cachedData.length > 0 && isCacheValid(index.id, interval);
                
                // 如果不是强制刷新且缓存有效，直接使用缓存
                if (!forceRefresh && cacheValid) {
                    const cacheAge = getCacheAge(index.id, interval);
                    const ageMinutes = Math.floor(cacheAge / 60000);
                    console.log(`💾 [${index.name}] 缓存有效，直接使用: ${cachedData.length}个点 (${interval}, 缓存年龄: ${ageMinutes}分钟)`);
                    chartsData[index.id] = cachedData;
                    updateChart(index);
                    updateInfo(index);
                    return; // 缓存有效，直接返回，不需要重新获取
                }
                
                // 缓存无效或强制刷新，先显示旧缓存（如果有），然后获取新数据
                if (cachedData && cachedData.length > 0) {
                    console.log(`💾 [${index.name}] 缓存已过期，先显示旧数据，然后更新: ${cachedData.length}个点 (${interval})`);
                    chartsData[index.id] = cachedData;
                    updateChart(index);
                    updateInfo(index);
                }

                // 确定数据源优先级
                let sources = ['yahoo'];

                if ((index.id === 'kcb50' || index.id === 'csi300') && interval === '1d') {
                    sources = ['sina', 'yahoo'];
                }

                let parsedData = null;
                let usedSource = null;

                // 尝试各个数据源
                for (const sourceName of sources) {
                    try {
                        console.log(`📡 [${index.name}] 尝试数据源: ${dataSources[sourceName].name}`);
                        parsedData = await dataSources[sourceName].fetchFunc(index, interval);

                        if (parsedData && parsedData.length > 1) {
                            usedSource = sourceName;

                        console.log(`ℹ️ [${index.name}] 显示最新价格: ${parsedData[0].y.toFixed(2)}`);
                    } else if (!cachedData || cachedData.length < 2) {
                        showError(index, `数据不足：仅${parsedData.length}个数据点`);
                    }
                    return;
                }

                // 按时间排序
                parsedData.sort((a, b) => a.x - b.x);

                chartsData[index.id] = parsedData;

                // 保存到缓存（使用对应的interval）
                saveCachedData(index.id, parsedData, interval);

                updateChart(index);
                updateInfo(index);
                console.log(`✅ [${index.name}] 成功获取${parsedData.length}个数据点 (来源: ${dataSources[usedSource].name}, 粒度: ${interval})`);
                console.log(`   📅 时间范围: ${parsedData[0].x.toLocaleString('zh-CN')} 至 ${parsedData[parsedData.length-1].x.toLocaleString('zh-CN')}`);
                console.log(`   💰 价格范围: ${Math.min(...parsedData.map(d => d.y)).toFixed(2)} 至 ${Math.max(...parsedData.map(d => d.y)).toFixed(2)}`);

            } catch (error) {
                console.error(`❌ ${index.name} 详细错误:`, error);

                // 如果是CORS错误，下次使用代理
                if (error.message && error.message.includes('CORS')) {
                    console.warn('⚠️ 检测到CORS错误，下次将使用代理');
                    window.useCorsProxy = true;
                }

                showError(index, `网络错误: ${error.message}`);
            }
        }

        // 判断是否在开盘时间
        function isMarketOpen(category) {
            const now = new Date();
            const day = now.getDay(); // 0=周日, 1-5=周一至周五, 6=周六
            const hour = now.getHours();
            const minute = now.getMinutes();

            // 周末不开盘
            if (day === 0 || day === 6) return false;

            if (category === 'us') {
                // 美股开盘时间：周一至周五 北京时间 21:30 - 次日04:00
                // 简化判断：21:30 - 23:59 或 00:00 - 04:00
                return (hour >= 21 && hour <= 23) || (hour >= 0 && hour < 4);
            } else if (category === 'hk') {
                // 港股开盘时间：周一至周五 09:30-12:00, 13:00-16:00
                return (hour >= 9 && hour < 12) || (hour >= 13 && hour < 16);
            } else if (category === 'cn') {
                // A股开盘时间：周一至周五 09:30-11:30, 13:00-15:00
                return (hour >= 9 && hour < 12) || (hour >= 13 && hour < 15);
            }

            return false;
        }

        // 智能自动更新 - 根据开盘状态动态调整频率
        function startAutoUpdate() {
            function scheduleNextUpdate() {
                const anyMarketOpen = indices.some(index => isMarketOpen(index.category));

                // 确定更新间隔
                let updateInterval;
                if (anyMarketOpen) {
                    updateInterval = 5 * 60 * 1000; // 开盘时间：5分钟
                    console.log('⏰ 市场开盘中，设置5分钟更新间隔');
                } else {
                    updateInterval = 60 * 60 * 1000; // 盘后：1小时
                    console.log('⏰ 市场休市中，设置1小时更新间隔');
                }

                setTimeout(() => {
                    console.log('🔄 开始定时更新数据...');

                    indices.forEach((index, idx) => {
                        const cacheAge = getCacheAge(index.id);
                        const cacheAgeMinutes = Math.floor(cacheAge / 60000);

                        if (isMarketOpen(index.category)) {
                            // 开盘时间：缓存超过5分钟就更新
                            if (cacheAge > 5 * 60 * 1000) {
                                console.log(`🔄 [${index.name}] 开盘中，更新数据（缓存${cacheAgeMinutes}分钟）`);
                                setTimeout(() => fetchRealData(index), idx * 200);
                            }
                        } else {
                            // 盘后：缓存超过1小时才更新
                            if (cacheAge > 60 * 60 * 1000) {
                                console.log(`🔄 [${index.name}] 盘后，更新数据（缓存${cacheAgeMinutes}分钟）`);
                                setTimeout(() => fetchRealData(index), idx * 200);
                            }
                        }
                    });

                    updateLastUpdateTime();

                    // 递归调度下一次更新
                    scheduleNextUpdate();
                }, updateInterval);
            }

            // 开始调度
            scheduleNextUpdate();
        }

        // ==================== 枢轴点功能 ====================
        
        // 生成枢轴点的水平线数据
        function createPivotLine(startDate, endDate, value) {
            return [
                { x: new Date(startDate), y: value },
                { x: new Date(endDate), y: value }
            ];
        }

        // 获取月度枢轴点的时间范围
        function getMonthlyPivotTimeRange(dateStr) {
            const [year, month] = dateStr.split('-').map(Number);
            const startDate = new Date(year, month - 1, 1, 0, 0, 0, 0);
            const lastDay = new Date(year, month, 0).getDate();
            const endDate = new Date(year, month - 1, lastDay, 23, 59, 59, 999);
            return { startDate, endDate };
        }

        // 获取周度枢轴点的时间范围
        function getWeeklyPivotTimeRange(dateStr, endDateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const [endYear, endMonth, endDay] = endDateStr.split('-').map(Number);
            const startDate = new Date(year, month - 1, day, 0, 0, 0, 0);
            const endDate = new Date(endYear, endMonth - 1, endDay, 23, 59, 59, 999);
            return { startDate, endDate };
        }

        // 判断时间范围是否与图表可见范围有交集
        function isTimeRangeVisible(rangeStart, rangeEnd, chartStartTime, chartEndTime) {
            if (rangeEnd < chartStartTime || rangeStart > chartEndTime) {
                return false;
            }
            return true;
        }

        // 为图表添加月度枢轴点
        function addMonthlyPivots(index, chart, chartData) {
            if (!index.monthlyPivots || index.monthlyPivots.length === 0) return;
            
            let chartStartTime = null;
            let chartEndTime = null;
            if (chartData && chartData.length > 0) {
                chartStartTime = chartData[0].x.getTime();
                chartEndTime = chartData[chartData.length - 1].x.getTime();
            }
            
            const monthlyGroups = {};
            index.monthlyPivots.forEach(pivot => {
                if (!monthlyGroups[pivot.date]) {
                    monthlyGroups[pivot.date] = [];
                }
                monthlyGroups[pivot.date].push(pivot);
            });
            
            Object.keys(monthlyGroups).forEach(monthStr => {
                const pivots = monthlyGroups[monthStr];
                const { startDate, endDate } = getMonthlyPivotTimeRange(monthStr);
                
                // 注释掉时间范围检查，始终显示配置的枢轴点
                // if (chartStartTime && chartEndTime) {
                //     if (!isTimeRangeVisible(startDate.getTime(), endDate.getTime(), chartStartTime, chartEndTime)) {
                //         return;
                //     }
                // }
                
                const month = monthStr.split('-')[1];
                const legendPrefix = `M${month}`;
                
                pivots.forEach((pivot, idx) => {
                    const lineData = createPivotLine(startDate, endDate, pivot.value);
                    
                    // 月度枢轴点使用高透明度+较粗线条（更显眼）
                    let color = 'rgba(245, 158, 11, 0.8)';  // P点橙色 80%
                    if (pivot.label.startsWith('R')) {
                        color = 'rgba(59, 130, 246, 0.8)';  // R蓝色 80%
                    } else if (pivot.label.startsWith('S')) {
                        color = 'rgba(239, 68, 68, 0.8)';   // S红色 80%
                    }
                    
                    const showLegend = idx === 0;
                    
                    chart.data.datasets.push({
                        label: showLegend ? legendPrefix : '',
                        pivotType: pivot.label,
                        pivotLabel: `${legendPrefix}-${pivot.label}`,
                        isPivot: true,
                        pivotPeriod: 'monthly',
                        data: lineData,
                        borderColor: color,
                        borderWidth: 3,           // 加粗 3px，实线
                        pointRadius: 0,           // 不显示点
                        pointHoverRadius: 0,      // hover也不显示
                        pointHitRadius: 0,        // 不响应鼠标点击
                        fill: false,
                        tension: 0,
                        order: 2                  // 底层
                    });
                });
            });
        }

        // 为图表添加周度枢轴点
        function addWeeklyPivots(index, chart, chartData) {
            if (!index.weeklyPivots || index.weeklyPivots.length === 0) return;
            
            let chartStartTime = null;
            let chartEndTime = null;
            if (chartData && chartData.length > 0) {
                chartStartTime = chartData[0].x.getTime();
                chartEndTime = chartData[chartData.length - 1].x.getTime();
            }
            
            const weeklyGroups = {};
            index.weeklyPivots.forEach(pivot => {
                const weekKey = `${pivot.date}_${pivot.endDate}`;
                if (!weeklyGroups[weekKey]) {
                    weeklyGroups[weekKey] = [];
                }
                weeklyGroups[weekKey].push(pivot);
            });
            
            const weekNumbers = {};
            Object.keys(weeklyGroups).forEach(weekKey => {
                const [dateStr] = weekKey.split('_');
                const [year, month] = dateStr.split('-').slice(0, 2);
                const monthKey = `${year}-${month}`;
                
                if (!weekNumbers[monthKey]) {
                    weekNumbers[monthKey] = [];
                }
                if (!weekNumbers[monthKey].includes(weekKey)) {
                    weekNumbers[monthKey].push(weekKey);
                }
            });
            
            Object.keys(weeklyGroups).forEach(weekKey => {
                const pivots = weeklyGroups[weekKey];
                const [dateStr, endDateStr] = weekKey.split('_');
                const { startDate, endDate } = getWeeklyPivotTimeRange(dateStr, endDateStr);
                
                // 注释掉时间范围检查，始终显示配置的枢轴点
                // if (chartStartTime && chartEndTime) {
                //     if (!isTimeRangeVisible(startDate.getTime(), endDate.getTime(), chartStartTime, chartEndTime)) {
                //         return;
                //     }
                // }
                
                const [year, month] = dateStr.split('-').slice(0, 2);
                const monthKey = `${year}-${month}`;
                const weekNumber = weekNumbers[monthKey].indexOf(weekKey) + 1;
                const legendPrefix = `M${month}W${weekNumber}`;
                
                pivots.forEach((pivot, idx) => {
                    const lineData = createPivotLine(startDate, endDate, pivot.value);
                    
                    // 周度枢轴点使用较深色系
                    let color = 'rgba(251, 191, 36, 0.7)';  // P点黄色
                    if (pivot.label.startsWith('R')) {
                        color = 'rgba(96, 165, 250, 0.7)';  // R蓝色
                    } else if (pivot.label.startsWith('S')) {
                        color = 'rgba(248, 113, 113, 0.7)'; // S红色
                    }
                    
                    const showLegend = idx === 0;
                    
                    chart.data.datasets.push({
                        label: showLegend ? legendPrefix : '',
                        pivotType: pivot.label,
                        pivotLabel: `${legendPrefix}-${pivot.label}`,
                        isPivot: true,
                        pivotPeriod: 'weekly',
                        data: lineData,
                        borderColor: color,
                        borderWidth: 2,           // 中等粗
                        borderDash: [5, 3],       // 短虚线
                        pointRadius: 0,           // 不显示点
                        pointHoverRadius: 0,      // hover也不显示
                        pointHitRadius: 0,        // 不响应鼠标点击
                        fill: false,
                        tension: 0,
                        order: 1                  // 中层
                    });
                });
                
                // 添加周度枢轴点之间的背景渐变
                const pivotOrder = { 'R3': 0, 'R2': 1, 'R1': 2, 'P': 3, 'S1': 4, 'S2': 5, 'S3': 6 };
                const sortedPivots = [...pivots].sort((a, b) => pivotOrder[a.label] - pivotOrder[b.label]);
                
                const P = sortedPivots.find(p => p.label === 'P');
                if (P) {
                    // P→R1→R2→R3 蓝色渐变（从浅到深）
                    for (let i = 3; i > 0; i--) {
                        const current = sortedPivots[i];      // R1, R2, R3
                        const next = sortedPivots[i - 1];     // P, R1, R2
                        if (!current || !next) continue;
                        
                        // 透明度从0.03到0.09，逐级变深
                        const opacity = 0.03 + (4 - i) * 0.03;
                        
                        chart.data.datasets.push({
                            label: '',  // 背景不显示图例
                            data: createPivotLine(startDate, endDate, current.value),
                            backgroundColor: `rgba(59, 130, 246, ${opacity})`,  // 蓝色
                            borderWidth: 0,
                            pointRadius: 0,
                            pointHoverRadius: 0,
                            pointHitRadius: 0,
                            fill: {
                                target: {
                                    value: next.value
                                },
                                above: `rgba(59, 130, 246, ${opacity})`
                            },
                            order: 3,  // 最底层
                            isPivot: false  // 标记为非枢轴点，tooltip不显示
                        });
                    }
                    
                    // P→S1→S2→S3 红色渐变（从浅到深）
                    for (let i = 3; i < 6; i++) {
                        const current = sortedPivots[i];      // P, S1, S2
                        const next = sortedPivots[i + 1];     // S1, S2, S3
                        if (!current || !next) continue;
                        
                        // 透明度从0.03到0.09，逐级变深
                        const opacity = 0.03 + (i - 3) * 0.03;
                        
                        chart.data.datasets.push({
                            label: '',  // 背景不显示图例
                            data: createPivotLine(startDate, endDate, current.value),
                            backgroundColor: `rgba(239, 68, 68, ${opacity})`,  // 红色
                            borderWidth: 0,
                            pointRadius: 0,
                            pointHoverRadius: 0,
                            pointHitRadius: 0,
                            fill: {
                                target: {
                                    value: next.value
                                },
                                below: `rgba(239, 68, 68, ${opacity})`
                            },
                            order: 3,  // 最底层
                            isPivot: false  // 标记为非枢轴点，tooltip不显示
                        });
                    }
                }
            });
        }

        // ==================== 结束枢轴点功能 ====================

        // 更新图表（包含枢轴点）
        function updateChart(index) {
            const chart = charts[index.id];
            if (!chart) return;

            const data = chartsData[index.id];
            chart.data.datasets[0].data = data;
            
            // 重置点的样式为默认值
            chart.data.datasets[0].pointRadius = 0;
            chart.data.datasets[0].pointHoverRadius = 5;
            chart.data.datasets[0].pointBackgroundColor = index.color;
            chart.data.datasets[0].pointBorderColor = '#ffffff';
            chart.data.datasets[0].pointBorderWidth = 2;
            chart.data.datasets[0].order = 0;  // 指数主线在最顶层
            chart.data.datasets[0].borderWidth = 2.5;  // 主线稍粗

            // 只保留主数据集
            chart.data.datasets = chart.data.datasets.filter(ds => ds.label === index.name);
            
            // 添加月度枢轴点
            addMonthlyPivots(index, chart, data);
            
            // 添加周度枢轴点
            addWeeklyPivots(index, chart, data);

            chart.update('none');
        }

        // ==================== 以下为旧的禁用代码（已废弃，不影响现有功能） ====================
        
        // 旧的枢轴点生成函数（已禁用，新实现见上方）
        function generatePivotDataPoints_DISABLED(index, data, startDateStr, endDateStr, pivotValue) {
            const points = [];

            // 解析开始和结束日期（格式：YYYY-MM-DD，用户数据是中国时间）
            const [startYear, startMonth, startDay] = startDateStr.split('-').map(Number);
            const [endYear, endMonth, endDay] = endDateStr.split('-').map(Number);

            // 创建日期对象（中国时间）
            const startDate = new Date(startYear, startMonth - 1, startDay, 0, 0, 0, 0);
            const endDate = new Date(endYear, endMonth - 1, endDay, 23, 59, 59, 999);

            // 如果有市场数据，使用市场数据的时间点
            if (data && data.length > 0) {
                // 筛选出在枢轴点日期范围内的市场数据点
                const filteredData = data.filter(d => {
                    const pointTime = d.x.getTime();
                    return pointTime >= startDate.getTime() && pointTime <= endDate.getTime();
                });

                // 为每个市场数据点创建枢轴点
                filteredData.forEach(d => {
                    points.push({
                        x: new Date(d.x),
                        y: pivotValue
                    });
                });

                // 如果过滤后没有数据点，生成开始和结束两个点
                if (points.length === 0) {
                    points.push({ x: new Date(startDate), y: pivotValue });
                    points.push({ x: new Date(endDate), y: pivotValue });
                }
            } else {
                // 没有市场数据时，只生成开始和结束两个点
                points.push({ x: new Date(startDate), y: pivotValue });
                points.push({ x: new Date(endDate), y: pivotValue });
            }

            return points;
        }

        // 添加枢轴点到图表（已禁用）
        function addPivotsToChart_DISABLED(index, chart, data) {
            const monthlyPivots = index.monthlyPivotsData;
            const weeklyPivots = index.weeklyPivotsData;

            // 月度枢轴点
            const monthlyGroups = {};
            monthlyPivots.forEach(pivot => {
                const monthKey = pivot.date;
                if (!monthlyGroups[monthKey]) monthlyGroups[monthKey] = [];
                monthlyGroups[monthKey].push(pivot);
            });

            Object.keys(monthlyGroups).forEach(monthKey => {
                const group = monthlyGroups[monthKey];
                const monthLabel = monthKey.split('-')[1];
                const legendLabel = `M${monthLabel}`;

                group.forEach((pivot) => {
                    const [year, month] = pivot.date.split('-').map(Number);
                    // 月度枢轴点：从当月第一天到最后一天
                    const monthStartStr = `${year}-${String(month).padStart(2, '0')}-01`;
                    const lastDay = new Date(year, month, 0).getDate();
                    const monthEndStr = `${year}-${String(month).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

                    let borderColor = '#f59e0b';
                    if (pivot.label && pivot.label.startsWith('S')) {

                    } else if (pivot.label && pivot.label.startsWith('R')) {
                        borderColor = '#3b82f6';
                    } else if (pivot.label === 'P') {
                        borderColor = '#f59e0b';
                    }

                    chart.data.datasets.push({
                        label: legendLabel,
                        pivotType: pivot.label,

                        pointRadius: 0,
                        fill: false,
                        spanGaps: true
                    });
                });

            // 周度枢轴点

                const weekKey = pivot.date;
                if (!weeklyGroups[weekKey]) weeklyGroups[weekKey] = [];
                weeklyGroups[weekKey].push(pivot);

                const [year, month, day] = pivot.date.split('-').map(Number);
                const monthKey = `${year}-${String(month).padStart(2, '0')}`;
                if (!weekNumberMap[monthKey]) weekNumberMap[monthKey] = [];
                if (!weekNumberMap[monthKey].includes(pivot.date)) {
                    weekNumberMap[monthKey].push(pivot.date);
                }
            });

            Object.keys(weeklyGroups).forEach(weekKey => {
                const group = weeklyGroups[weekKey];
                const pivot = group[0];
                const [year, month, day] = pivot.date.split('-').map(Number);
                const monthKey = `${year}-${String(month).padStart(2, '0')}`;
                const weekNumber = weekNumberMap[monthKey].indexOf(pivot.date) + 1;
                const legendLabel = `M${month}W${weekNumber}`;

                group.forEach((pivot) => {
                    // 周度枢轴点：使用配置的开始和结束日期
                    const startDateStr = pivot.date;
                    const endDateStr = pivot.endDate || pivot.date;

                    let borderColor = '#06b6d4';
                    if (pivot.label && pivot.label.startsWith('S')) {
                        borderColor = '#f87171';
                    } else if (pivot.label && pivot.label.startsWith('R')) {
                        borderColor = '#60a5fa';
                    } else if (pivot.label === 'P') {
                        borderColor = '#fbbf24';
                    }

                    chart.data.datasets.push({
                        label: legendLabel,
                        pivotType: pivot.label,
                        data: generatePivotDataPoints(index, data, startDateStr, endDateStr, pivot.value),
                        borderColor: borderColor,
                        borderWidth: 1.5,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false,
                        spanGaps: true
                    });
                });

                // 添加背景渐变
                const order = { 'R3': 0, 'R2': 1, 'R1': 2, 'P': 3, 'S1': 4, 'S2': 5, 'S3': 6 };
                group.sort((a, b) => order[a.label] - order[b.label]);

                const P = group.find(p => p.label === 'P');
                if (!P) return;

                // 使用P的日期范围作为背景渐变的范围
                const startDateStr = P.date;
                const endDateStr = P.endDate || P.date;

                // P→R3 蓝色渐变 (增强对比度)
                for (let i = 3; i > 0; i--) {
                    const current = group[i];
                    const next = group[i - 1];
                    if (!current || !next) continue;

                    // 从 0.08 到 0.20，增加区别度
                    const opacity = 0.06 + (4 - i) * 0.06;

                    chart.data.datasets.push({
                        label: `周度背景 ${current.label}-${next.label}`,
                        data: generatePivotDataPoints(index, data, startDateStr, endDateStr, current.value),
                        backgroundColor: `rgba(59, 130, 246, ${opacity})`,
                        borderWidth: 0,
                        pointRadius: 0,
                        fill: {
                            target: { value: next.value },
                            above: `rgba(59, 130, 246, ${opacity})`
                        },
                        spanGaps: true,
                        order: 10
                    });
                }

                // P→S3 红色渐变 (增强对比度)
                for (let i = 3; i < 6; i++) {
                    const current = group[i];
                    const next = group[i + 1];
                    if (!current || !next) continue;

                    // 从 0.08 到 0.20，增加区别度
                    const opacity = 0.06 + (i - 2) * 0.06;

                    chart.data.datasets.push({
                        label: `周度背景 ${current.label}-${next.label}`,
                        data: generatePivotDataPoints(index, data, startDateStr, endDateStr, current.value),
                        backgroundColor: `rgba(239, 68, 68, ${opacity})`,
                        borderWidth: 0,
                        pointRadius: 0,
                        fill: {
                            target: { value: next.value },
                            below: `rgba(239, 68, 68, ${opacity})`
                        },
                        spanGaps: true,
                        order: 10
                    });
                }
            });
        }

        // 动态调整Y轴（已禁用）
        function adjustYAxis_DISABLED(index, chart, data) {
            if (index.showPivots && (index.monthlyPivotsData.length > 0 || index.weeklyPivotsData.length > 0)) {
                let allYValues = data.map(d => d.y);
                index.monthlyPivotsData.forEach(pivot => allYValues.push(pivot.value));
                index.weeklyPivotsData.forEach(pivot => allYValues.push(pivot.value));

                const minY = Math.min(...allYValues);
                const maxY = Math.max(...allYValues);
                const range = maxY - minY;

                chart.options.scales.y.min = minY - range * 0.1;
                chart.options.scales.y.max = maxY + range * 0.1;
            }
        }

        // 更新指数信息
        function updateInfo(index) {
            const data = chartsData[index.id];
            if (!data || data.length === 0) {
                console.warn(`⚠️ ${index.name}: 无数据无法更新信息`);
                return;
            }

            // 获取最后一个有效数据点
            let currentValue = null;
            let previousValue = null;

            // 从后往前找最后一个有效值
            for (let i = data.length - 1; i >= 0; i--) {
                if (data[i] && data[i].y !== null && !isNaN(data[i].y)) {
                    currentValue = data[i].y;
                    // 找前一个有效值
                    for (let j = i - 1; j >= 0; j--) {
                        if (data[j] && data[j].y !== null && !isNaN(data[j].y)) {
                            previousValue = data[j].y;
                            break;
                        }
                    }
                    break;
                }
            }

            if (currentValue === null) {
                console.warn(`⚠️ ${index.name}: 找不到有效数据点`);
                document.getElementById(`${index.id}-price`).textContent = '--';
                document.getElementById(`${index.id}-change`).textContent = '--';
                return;
            }

            // 如果没有前一个值，使用当前值（涨跌为0）
            if (previousValue === null) {
                previousValue = currentValue;
            }

            const change = currentValue - previousValue;
            const changePercent = previousValue !== 0 ? (change / previousValue * 100).toFixed(2) : '0.00';

            const priceElement = document.getElementById(`${index.id}-price`);
            priceElement.textContent = currentValue.toFixed(2);
            priceElement.style.color = '#1e293b'; // 恢复正常颜色

            const changeElement = document.getElementById(`${index.id}-change`);
            const changeText = `${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePercent}%)`;
            changeElement.textContent = changeText;
            changeElement.className = change >= 0 ? 'change positive' : 'change negative';
        }

        // 设置单个指数时间范围
        function setIndexTimeRange(indexId, range, customStart, customEnd) {
            const chart = charts[indexId];
            const data = chartsData[indexId];
            if (!chart) return;

            // 使用当前实时时间作为结束时间
            const now = new Date();
            let startDate, endDate, timeUnit;

            if (customStart && customEnd) {
                // 自定义时间范围
                startDate = new Date(customStart);
                endDate = new Date(customEnd);

                // 根据时间跨度自动选择合适的时间单位
                const diffDays = (endDate - startDate) / (24 * 60 * 60 * 1000);
                if (diffDays <= 2) {
                    timeUnit = 'hour';
                } else if (diffDays <= 60) {
                    timeUnit = 'day';
                } else {
                    timeUnit = 'week';
                }
            } else {
                // 预设时间范围
                endDate = now;

                switch(range) {
                    case '1D':
                        startDate = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                        timeUnit = 'hour';
                        break;
                    case '1W':
                        startDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                        timeUnit = 'day';
                        break;
                    case '1M':
                        startDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                        timeUnit = 'day';
                        break;
                    case '3M':
                        startDate = new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000);
                        timeUnit = 'week';
                        break;
                }
            }

            chart.options.scales.x.time.unit = timeUnit;
            chart.options.scales.x.min = startDate;
            chart.options.scales.x.max = endDate;
            chart.update();
        }

        // 设置所有指数时间范围
        function setAllTimeRange(range) {
            // 获取切换前后的interval
            const oldInterval = getDataInterval(currentTimeRange);
            const newInterval = getDataInterval(range);
            
            // 更新全局时间范围
            currentTimeRange = range;
            
            // 如果interval发生变化，需要重新获取数据
            const needRefresh = oldInterval !== newInterval;
            
            if (needRefresh) {
                console.log(`🔄 时间范围切换: ${range}, 数据粒度从 ${oldInterval} 变为 ${newInterval}，重新获取数据...`);
                indices.forEach((index, idx) => {
                    // 先调整图表显示范围
                    setIndexTimeRange(index.id, range);
                    // 延迟获取数据，避免同时发起过多请求
                    setTimeout(() => {
                        fetchRealData(index, true); // 强制刷新
                    }, idx * 200);
                });
            } else {
                // interval没变化，只调整显示范围
                indices.forEach(index => {
                    setIndexTimeRange(index.id, range);
                });
            }
        }

        // 打开自定义时间筛选对话框
        function openCustomTimeFilter() {
            const startDate = prompt('请输入开始时间（格式：YYYY-MM-DD 或 YYYY-MM-DD HH:mm）', '2025-01-01');
            if (!startDate) return;

            const endDate = prompt('请输入结束时间（格式：YYYY-MM-DD 或 YYYY-MM-DD HH:mm）\n支持未来时间', '2025-12-01');
            if (!endDate) return;

            try {
                // 验证日期格式
                const start = new Date(startDate);
                const end = new Date(endDate);

                if (isNaN(start.getTime()) || isNaN(end.getTime())) {
                    alert('日期格式错误，请使用 YYYY-MM-DD 或 YYYY-MM-DD HH:mm 格式');
                    return;
                }

                if (start >= end) {
                    alert('开始时间必须早于结束时间');
                    return;
                }

                // 应用自定义时间范围到所有图表
                indices.forEach(index => {
                    setIndexTimeRange(index.id, null, startDate, endDate);
                });

                console.log(`✅ 已应用自定义时间范围: ${startDate} 至 ${endDate}`);
            } catch (error) {
                alert(`时间设置错误: ${error.message}`);
            }
        }

        // 重置单个指数缩放
        function resetIndexZoom(indexId) {
            const chart = charts[indexId];
            if (chart) {
                chart.resetZoom();
            }
        }

        // 重置所有指数缩放
        function resetAllZoom() {
            indices.forEach(index => {
                resetIndexZoom(index.id);
            });
        }

        // 切换枢轴点显示（已禁用）
        // 旧的切换枢轴点显示函数（已禁用）
        function toggleIndexPivots_DISABLED(indexId) {
            const index = indices.find(i => i.id === indexId);
            index.showPivots = !index.showPivots;
            updateChart(index);
        }
        
        // ==================== 结束旧代码 ====================

        // 打开枢轴点模态框
        function openPivotModal(indexId, type) {
            const modal = document.getElementById(`modal-${indexId}-${type}`);
            modal.classList.add('active');
            updatePivotList(indexId, type);
        }

        // 关闭枢轴点模态框
        function closePivotModal(indexId, type) {
            const modal = document.getElementById(`modal-${indexId}-${type}`);
            modal.classList.remove('active');
        }

        // 保存枢轴点
        function savePivot(indexId, type) {
            const index = indices.find(i => i.id === indexId);
            const dateInput = document.getElementById(`${indexId}-${type}-date`);
            const valueInput = document.getElementById(`${indexId}-${type}-value`);

            const date = dateInput.value;
            const value = parseFloat(valueInput.value);

            if (!date || isNaN(value)) {
                alert('请填写完整的日期和数值');
                return;
            }

            const pivotArray = type === 'monthly' ? index.monthlyPivotsData : index.weeklyPivotsData;
            const storageKey = `pivots_${indexId}_${type}`;

            const newPivot = { date: date, value: value };

            // 如果是周度，还需要结束日期
            if (type === 'weekly') {
                const endDateInput = document.getElementById(`${indexId}-weekly-enddate`);
                if (endDateInput && endDateInput.value) {
                    newPivot.endDate = endDateInput.value;
                }
            }

            pivotArray.push(newPivot);
            pivotArray.sort((a, b) => new Date(a.date) - new Date(b.date));

            localStorage.setItem(storageKey, JSON.stringify(pivotArray));

            dateInput.value = '';
            valueInput.value = '';
            if (type === 'weekly') {
                const endDateInput = document.getElementById(`${indexId}-weekly-enddate`);
                if (endDateInput) endDateInput.value = '';
            }

            updatePivotList(indexId, type);
            updateChart(index);
            updateInfo(index);

            alert('枢轴点已保存');
        }

        // 快速添加完整枢轴点
        function quickAddPivots(indexId, type) {
            const index = indices.find(i => i.id === indexId);

            let date, endDate;
            if (type === 'monthly') {
                date = prompt('请输入月份（格式：2025-11）：', '2025-11');
            } else {
                date = prompt('请输入开始日期（格式：2025-11-17）：', '2025-11-17');
                if (date) {
                    endDate = prompt('请输入结束日期（格式：2025-11-23）：', '2025-11-23');
                }
            }

            if (!date) return;
            if (type === 'weekly' && !endDate) return;

            const r3 = parseFloat(prompt('请输入 R3（阻力位3）：', '28599.4'));
            const r2 = parseFloat(prompt('请输入 R2（阻力位2）：', '27390.7'));
            const r1 = parseFloat(prompt('请输入 R1（阻力位1）：', '26624.4'));
            const p = parseFloat(prompt('请输入 P（主枢轴点）：', '25415.8'));
            const s1 = parseFloat(prompt('请输入 S1（支撑位1）：', '24649.5'));
            const s2 = parseFloat(prompt('请输入 S2（支撑位2）：', '23440.8'));
            const s3 = parseFloat(prompt('请输入 S3（支撑位3）：', '22674.5'));

            if (isNaN(r3) || isNaN(r2) || isNaN(r1) || isNaN(p) || isNaN(s1) || isNaN(s2) || isNaN(s3)) {
                alert('输入的数据不完整或格式错误！');
                return;
            }

            const pivotArray = type === 'monthly' ? index.monthlyPivotsData : index.weeklyPivotsData;
            const storageKey = `pivots_${indexId}_${type}`;

            // 清除该日期的旧数据
            const filteredArray = pivotArray.filter(pivot => pivot.date !== date);

            const newPivots = [
                { date: date, value: r3, label: 'R3' },
                { date: date, value: r2, label: 'R2' },
                { date: date, value: r1, label: 'R1' },
                { date: date, value: p, label: 'P' },
                { date: date, value: s1, label: 'S1' },
                { date: date, value: s2, label: 'S2' },
                { date: date, value: s3, label: 'S3' }
            ];

            // 如果是周度，添加结束日期
            if (type === 'weekly' && endDate) {
                newPivots.forEach(pivot => {
                    pivot.endDate = endDate;
                });
            }

            filteredArray.push(...newPivots);
            filteredArray.sort((a, b) => new Date(a.date) - new Date(b.date));

            if (type === 'monthly') {
                index.monthlyPivotsData = filteredArray;
            } else {
                index.weeklyPivotsData = filteredArray;
            }

            localStorage.setItem(storageKey, JSON.stringify(filteredArray));

            updateChart(index);
            updateInfo(index);
            closePivotModal(indexId, type);

            alert(`已成功添加 ${date} ${type === 'monthly' ? '月度' : '周度'}枢轴点的7个数据！`);
        }

        // 更新枢轴点列表
        function updatePivotList(indexId, type) {
            const index = indices.find(i => i.id === indexId);
            const pivotArray = type === 'monthly' ? index.monthlyPivotsData : index.weeklyPivotsData;
            const listElement = document.getElementById(`${indexId}-${type}-list`);

            if (pivotArray.length === 0) {
                listElement.innerHTML = '<p style="color: #94a3b8;">暂无数据</p>';
                return;
            }

            // 按日期分组显示
            const grouped = {};
            pivotArray.forEach((pivot, idx) => {
                const key = pivot.date;
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push({ ...pivot, originalIndex: idx });
            });

            listElement.innerHTML = Object.keys(grouped).map(dateKey => {
                const group = grouped[dateKey];
                const pivotLabels = group.map(p => `${p.label}: ${p.value.toFixed(2)}`).join(', ');
                return `
                    <div style="padding: 10px; background: #f1f5f9; margin-bottom: 5px; border-radius: 6px;">
                        <strong>${dateKey}</strong>${group[0].endDate ? ` ~ ${group[0].endDate}` : ''}<br>
                        <span style="font-size: 0.9em;">${pivotLabels}</span>
                    </div>
                `;
            }).join('');
        }

        // 更新最后更新时间
        function updateLastUpdateTime() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent =
                now.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
        }

        // 初始化CORS代理设置
        function initCorsProxy() {
            // 从localStorage读取设置
            const savedSetting = localStorage.getItem('useCorsProxy');
            window.useCorsProxy = savedSetting !== 'false'; // 默认启用

            // 更新按钮文本
            const buttonText = document.getElementById('corsProxyText');
            if (buttonText) {
                buttonText.textContent = window.useCorsProxy ? '关闭CORS代理' : '启用CORS代理';
            }

            console.log(`🔧 CORS代理设置: ${window.useCorsProxy ? '已启用' : '已关闭'}`);
        }

        // 切换CORS代理
        function toggleCorsProxy() {
            window.useCorsProxy = !window.useCorsProxy;

            // 保存到localStorage
            localStorage.setItem('useCorsProxy', window.useCorsProxy.toString());

            const buttonText = document.getElementById('corsProxyText');

            if (window.useCorsProxy) {
                buttonText.textContent = '关闭CORS代理';
                console.log('✅ CORS代理已启用');
                alert('CORS代理已启用，页面将重新加载数据');
            } else {
                buttonText.textContent = '启用CORS代理';
                console.log('⚠️ CORS代理已关闭');
                alert('CORS代理已关闭，页面将重新加载数据');
            }

            // 重新加载所有数据
            location.reload();
        }

        // 切换标签页
        function switchTab(tab) {
            currentTab = tab;

            // 更新标签页按钮状态
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 筛选显示指数卡片
            indices.forEach(index => {
                const card = document.getElementById(`card-${index.id}`);
                if (!card) return;

                if (tab === 'all') {
                    card.style.display = 'block';
                } else if (tab === 'hk' && index.category === 'hk') {
                    card.style.display = 'block';
                } else if (tab === 'us' && index.category === 'us') {
                    card.style.display = 'block';
                } else if (tab === 'cn' && index.category === 'cn') {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // 页面加载时初始化
        window.addEventListener('load', function() {
            initCorsProxy(); // 初始化CORS代理设置
            initPage();
        });
    </script>
</body>
