<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 指数监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            padding: 0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header h1 {
            font-size: 1.3em;
            margin-bottom: 5px;
        }
        .update-time {
            font-size: 0.75em;
            opacity: 0.9;
        }
        .container {
            padding: 10px;
            padding-bottom: 80px;
        }
        .index-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-title {
            font-size: 0.9em;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .price-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
        }
        .current-price {
            font-size: 2em;
            font-weight: 700;
            color: #1e293b;
        }
        .price-change {
            font-size: 1em;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .price-change.positive {
            color: #10b981;
            background: #d1fae5;
        }
        .price-change.negative {
            color: #ef4444;
            background: #fee2e2;
        }
        .price-change.neutral {
            color: #64748b;
            background: #f1f5f9;
        }
        .pivot-section {
            border-top: 1px solid #f1f5f9;
            padding-top: 12px;
        }
        .pivot-title {
            font-size: 0.85em;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .pivot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .pivot-item {
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85em;
        }
        .pivot-item.resistance {
            background: #dbeafe;
            color: #1e40af;
        }
        .pivot-item.pivot {
            background: #fef3c7;
            color: #92400e;
        }
        .pivot-item.support {
            background: #fee2e2;
            color: #991b1b;
        }
        .pivot-label {
            font-weight: 700;
            font-size: 0.9em;
            margin-bottom: 4px;
        }
        .pivot-value {
            font-size: 0.9em;
        }
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f1f5f9;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            text-align: center;
            padding: 20px;
            color: #ef4444;
            font-size: 0.9em;
        }
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 10px;
            display: flex;
            gap: 10px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 指数监控</h1>
        <div class="update-time" id="updateTime">加载中...</div>
    </div>

    <div class="container" id="container">
        <div class="loading">
            <div class="spinner"></div>
            <div>正在加载数据...</div>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn" onclick="loadAllData()">🔄 刷新</button>
    </div>

    <script>
        const INDICES = [
            { 
                symbol: 'NDX', name: '纳斯达克100', sina: null,
                pivots: { R1: 26427.2, P: 25140.6, S1: 24148.3 }
            },
            { 
                symbol: 'SPX', name: '标普500', sina: null,
                pivots: { R1: 6980.2, P: 6751.1, S1: 6619.8 }
            },
            { 
                symbol: 'HSI', name: '恒生指数', sina: 'hf_HSI',
                pivots: { R1: 26972.3, P: 26075.4, S1: 24962.1 }
            },
            { 
                symbol: 'HSTECH', name: '恒生科技', sina: 'hf_HSTECH',
                pivots: { R1: 5962.5, P: 5662.1, S1: 5298.7 }
            },
            { 
                symbol: 'CSI300', name: '沪深300', sina: 'sh000300',
                pivots: { R1: 4681.9, P: 4551.9, S1: 4396.6 }
            },
            { 
                symbol: 'KCB50', name: '科创50', sina: 'sh000688',
                pivots: { R1: 1422.1, P: 1347.8, S1: 1252.8 }
            },
            { 
                symbol: 'XAUUSD', name: '现货黄金', sina: 'hf_GC',
                pivots: { R1: 4367.8, P: 4151.7, S1: 4040.4 }
            },
            { 
                symbol: 'XAGUSD', name: '现货白银', sina: 'hf_SI',
                pivots: { R1: 60.7, P: 53.6, S1: 50.0 }
            }
        ];

        async function loadAllData() {
            const container = document.getElementById('container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><div>正在加载数据...</div></div>';

            let html = '';
            for (const index of INDICES) {
                html += await createIndexCard(index);
            }
            
            container.innerHTML = html || '<div class="error">❌ 所有数据加载失败，请稍后重试</div>';
            updateTime();
        }

        async function createIndexCard(index) {
            const price = await fetchPrice(index);
            
            if (!price) {
                return `
                    <div class="index-card">
                        <div class="card-title">${index.name} (${index.symbol})</div>
                        <div class="error">暂无数据</div>
                    </div>
                `;
            }

            const change = price.change || 0;
            const changePct = price.changePct || 0;
            const changeClass = change > 0 ? 'positive' : change < 0 ? 'negative' : 'neutral';
            const changeSign = change >= 0 ? '+' : '';
            
            return `
                <div class="index-card">
                    <div class="card-title">${index.name} (${index.symbol})</div>
                    <div class="price-info">
                        <div class="current-price">${price.current.toFixed(2)}</div>
                        <div class="price-change ${changeClass}">
                            ${changeSign}${change.toFixed(2)} (${changePct.toFixed(2)}%)
                        </div>
                    </div>
                    <div class="pivot-section">
                        <div class="pivot-title">📊 关键枢轴点</div>
                        <div class="pivot-grid">
                            <div class="pivot-item resistance">
                                <div class="pivot-label">R1</div>
                                <div class="pivot-value">${index.pivots.R1.toFixed(2)}</div>
                            </div>
                            <div class="pivot-item pivot">
                                <div class="pivot-label">P</div>
                                <div class="pivot-value">${index.pivots.P.toFixed(2)}</div>
                            </div>
                            <div class="pivot-item support">
                                <div class="pivot-label">S1</div>
                                <div class="pivot-value">${index.pivots.S1.toFixed(2)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchPrice(index) {
            if (!index.sina) return null;
            
            try {
                const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
                const apiBase = isProduction ? '/api' : 'http://localhost:8903/api';
                const url = `${apiBase}/sina?symbol=${index.sina}`;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                
                const response = await fetch(url, { 
                    signal: controller.signal 
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error('API error');
                
                const text = await response.text();
                const match = text.match(/="([^"]+)"/);
                if (!match) return null;

                const parts = match[1].split(',');
                const current = parseFloat(parts[0] || parts[3]);
                const open = parseFloat(parts[1] || current);
                
                if (isNaN(current)) return null;

                const change = current - open;
                const changePct = open > 0 ? (change / open) * 100 : 0;

                return { current, change, changePct };
            } catch (error) {
                console.error(`获取 ${index.symbol} 失败:`, error);
                return null;
            }
        }

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('updateTime').textContent = `更新: ${timeStr}`;
        }

        // 页面加载完成后自动加载数据
        window.addEventListener('load', () => {
            loadAllData();
        });

        // 下拉刷新
        let startY = 0;
        let pulling = false;
        document.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                startY = e.touches[0].clientY;
                pulling = true;
            }
        });
        document.addEventListener('touchmove', (e) => {
            if (!pulling) return;
            const currentY = e.touches[0].clientY;
            if (currentY - startY > 100) {
                loadAllData();
                pulling = false;
            }
        });
        document.addEventListener('touchend', () => {
            pulling = false;
        });
    </script>
</body>
</html>
